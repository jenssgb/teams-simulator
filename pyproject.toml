[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-simulator"
version = "0.1.0"
description = "Stream prepared audio + image into Microsoft Teams as virtual mic and camera (Windows VM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jens Schneider" }]
keywords = ["microsoft-teams", "virtual-microphone", "virtual-camera", "obs", "vb-cable", "simulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "sounddevice>=0.4.7,<0.6",
    "soundfile>=0.12.1,<0.14",
    "pydub>=0.25.1,<0.26",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "opencv-python>=4.10,<5",
    "pyvirtualcam>=0.11,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "ruff>=0.5",
]

[project.scripts]
teams-sim = "teams_simulator.cli:main"
teams-sim-ui = "teams_simulator.ui:main"

[project.urls]
Homepage = "https://github.com/jenssgb/teams-simulator"
Issues = "https://github.com/jenssgb/teams-simulator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teams_simulator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
